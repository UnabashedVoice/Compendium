notes = "Reflexion Fourteenth sec. 12 (1697 pp. 265-266; lines 13342-13384; checked against page images, leaves n306-n307) answers Locke II.xxvii; the margin reads 'Consciousness cannot constitute Personal Identity'. The OCR reads the section number '12.' as 'Ti.'. Hamilton (reid-intellectual-powers-1851, line 13883) miscites it as sec. 14, which is the passage on angels (p. 267). The archive.org scandata page numbers are one too low here: leaf n306 is printed p. 265. Sec. 12 argues that a man must be the same before he can be conscious that he is the same, which is the circularity objection 39 years before Butler. Long s is OCR'd as 'f' (Confcioufnefs) and the side-notes are interleaved, so match quotations fuzzily and check them against page images. EEBO-TCP has no transcription of this work; a Tesseract re-OCR (tools/ocr_archive.py) would not fix the long s either. A second scan exists: archive.org bim_early-english-books-1641-1700_solid-philosophy-asserte_sergeant-john_1697."
